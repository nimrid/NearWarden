[package]
name = "agentguard-firewall-signer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AgentGuard AI Firewall attestation signer for OutLayer Intel TDX enclaves. The signing key is derived inside the TEE and never leaves it."

[[bin]]
name = "agentguard-firewall-signer"
path = "src/main.rs"

[dependencies]
wit-bindgen = "0.46"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
bs58 = "0.5"
hex = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
